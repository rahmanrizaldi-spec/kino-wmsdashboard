<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dceaf5">
<title>KINO WMS & Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#dceaf5}
.scene{
  position:fixed;inset:0;
  background:#dceaf5 url("./kino-daylight.jpg") center center/cover no-repeat;
  overflow:hidden;
}
.scene:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(10,48,82,.07));
  pointer-events:none;
}
.sweep{
  position:absolute;top:-25%;left:-30%;width:14%;height:150%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent);
  transform:rotate(18deg);filter:blur(14px);pointer-events:none;
  animation:sweep 14s linear infinite;
}
.hotspot{
  position:absolute;z-index:5;display:block;
  border-radius:24px;text-decoration:none;cursor:pointer;
  outline:none;transition:transform .25s ease,filter .25s ease;
}
.hotspot:after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.20) 50%,transparent 65%);
  transform:translateX(-150%);
  animation:buttonShine 8s ease-in-out infinite;
  pointer-events:none;
}
.hotspot:hover{filter:brightness(1.04);transform:translateY(-2px)}
.hotspot:active{transform:scale(.99)}
.pia{left:20.7%;top:46%;width:12.8%;height:27.5%}
.binbee{left:33.4%;top:46%;width:12.8%;height:27.5%}
.kapuk{left:46.4%;top:46%;width:12.8%;height:27.5%}
.cross{left:59.5%;top:46%;width:12.8%;height:27.5%}
.sodo{left:72.6%;top:46%;width:12.8%;height:27.5%}
.maintenance{cursor:not-allowed}
@keyframes sweep{
  0%{transform:translateX(-20%) rotate(18deg)}
  100%{transform:translateX(650%) rotate(18deg)}
}
@keyframes buttonShine{
  0%,55%{transform:translateX(-150%)}
  78%,100%{transform:translateX(150%)}
}
@media(max-width:600px){
  body{overflow:auto}
  .scene{
    position:absolute;min-height:100svh;height:100svh;
    background-position:center center;background-size:cover;
  }
  .sweep{width:22%;animation-duration:16s;opacity:.65}
  .hotspot{border-radius:14px}
  .pia{left:18%;top:42.5%;width:17%;height:22%}
  .binbee{left:34.5%;top:42.5%;width:17%;height:22%}
  .kapuk{left:51%;top:42.5%;width:17%;height:22%}
  .cross{left:67.5%;top:42.5%;width:17%;height:22%}
  .sodo{left:84%;top:42.5%;width:15%;height:22%}
}
@media(prefers-reduced-motion:reduce){
  .sweep,.hotspot:after{animation:none}
}
</style>
</head>
<body>
<div class="scene" aria-label="KINO WMS & Dashboard">
  <div class="sweep"></div>

  <a class="hotspot pia" href="#" aria-label="Dashboard PIA 100"
     onclick="openLink(event,'PIA')"></a>

  <a class="hotspot binbee" href="#" aria-label="Binbee"
     onclick="openLink(event,'BINBEE')"></a>

  <a class="hotspot kapuk maintenance" href="#" aria-label="WMS Kapuk - Under Maintenance"
     onclick="maintenanceMessage(event,'WMS Kapuk')"></a>

  <a class="hotspot cross maintenance" href="#" aria-label="Cross Docking - Under Maintenance"
     onclick="maintenanceMessage(event,'Cross Docking')"></a>

  <a class="hotspot sodo maintenance" href="#" aria-label="SODO Tracking - Under Maintenance"
     onclick="maintenanceMessage(event,'SODO Tracking')"></a>
</div>

<script>
const LINKS = {
  PIA: "https://script.google.com/",
  BINBEE: "https://script.google.com/"
};

function openLink(e,name){
  e.preventDefault();
  const url=LINKS[name];
  if(!url || url==="#"){
    alert("Link "+name+" belum diisi.");
    return;
  }
  window.location.href=url;
}

function maintenanceMessage(e,name){
  e.preventDefault();
  alert(name+" sedang Under Maintenance.");
}
</script>
</body>
</html>
