/*
  The reference artwork already contains the KINO logo,
  welcome title, glass panel and all five menu cards.
  These transparent hotspots only add navigation without
  drawing a second copy of the visual elements.
*/

/* ===== MOBILE RESPONSIVE LAYOUT ===== */
.mobile-ui { display:none; }

@media (max-width: 700px) {
  html, body {
    min-height:100%;
    height:auto;
    overflow-x:hidden;
    overflow-y:auto;
  }

  .stage {
    position:relative;
    min-height:100vh;
    height:auto;
    overflow:hidden;
    background-position:center top;
    background-size:auto 100%;
    background-attachment:fixed;
  }

  /* Hide the desktop transparent hotspots on phones. */
  .stage > .hotspot { display:none; }

  .mobile-ui {
    display:flex;
    position:relative;
    z-index:10;
    min-height:100vh;
    padding:28px 14px 30px;
    flex-direction:column;
    align-items:center;
  }

  .mobile-logo {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:3px;
    font-size:42px;
    line-height:1;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 3px 18px rgba(0,0,0,.5);
  }

  .mobile-logo-mark {
    width:43px;
    height:43px;
    position:relative;
    display:inline-block;
    filter:drop-shadow(0 0 12px rgba(56,189,248,.45));
  }

  .mobile-logo-mark:before,
  .mobile-logo-mark:after {
    content:"";
    position:absolute;
    width:45%;
    height:72%;
    top:14%;
    left:27%;
    transform:rotate(45deg);
  }

  .mobile-logo-mark:before {
    background:linear-gradient(135deg,#42d9ff,#1877ff);
    clip-path:polygon(0 0,100% 50%,0 100%,30% 50%);
  }

  .mobile-logo-mark:after {
    background:linear-gradient(135deg,#ffe22e,#f59e0b);
    transform:rotate(-45deg);
    clip-path:polygon(100% 0,0 50%,100% 100%,70% 50%);
  }

  .mobile-logo-text {
    background:linear-gradient(#fff,#dbeafe);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .mobile-line {
    width:58px;
    height:2px;
    margin:10px auto 14px;
    background:linear-gradient(90deg,transparent,#fbbf24,#38bdf8,transparent);
    box-shadow:0 0 12px rgba(56,189,248,.7);
  }

  .mobile-welcome {
    text-align:center;
    color:#fff;
    font-size:22px;
    line-height:1.2;
    font-weight:750;
    margin-bottom:17px;
    text-shadow:0 3px 16px rgba(0,0,0,.55);
  }

  .mobile-welcome span {
    background:linear-gradient(90deg,#fff,#67e8f9,#c4b5fd);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .mobile-panel {
    width:100%;
    padding:14px;
    border-radius:24px;
    background:rgba(7,24,49,.48);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:
      0 25px 55px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.22);
    backdrop-filter:blur(18px) saturate(135%);
    -webkit-backdrop-filter:blur(18px) saturate(135%);
  }

  .mobile-menus {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .mobile-menu {
    min-height:155px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:15px 8px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.09);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      0 12px 25px rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:transform .25s ease, box-shadow .25s ease;
  }

  .mobile-menu:hover,
  .mobile-menu:active {
    transform:translateY(-4px);
  }

  .mobile-menu .mi {
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    border-radius:17px;
    margin-bottom:13px;
    font-size:27px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.10);
    box-shadow:0 0 22px rgba(255,255,255,.10);
  }

  .mobile-menu .mt {
    font-size:13px;
    font-weight:800;
    line-height:1.2;
    text-align:center;
  }

  .mobile-menu .ml {
    width:38px;
    height:2px;
    margin-top:11px;
  }

  .m-pia { box-shadow:inset 0 0 35px rgba(37,99,235,.13),0 12px 25px rgba(0,0,0,.2); }
  .m-pia .mi { box-shadow:0 0 24px rgba(59,130,246,.45); }
  .m-pia .ml { background:#38bdf8; box-shadow:0 0 10px #38bdf8; }

  .m-binbee { box-shadow:inset 0 0 35px rgba(139,92,246,.13),0 12px 25px rgba(0,0,0,.2); }
  .m-binbee .mi { box-shadow:0 0 24px rgba(168,85,247,.45); }
  .m-binbee .ml { background:#c084fc; box-shadow:0 0 10px #c084fc; }

  .m-kapuk { box-shadow:inset 0 0 35px rgba(16,185,129,.13),0 12px 25px rgba(0,0,0,.2); }
  .m-kapuk .mi { box-shadow:0 0 24px rgba(16,185,129,.45); }
  .m-kapuk .ml { background:#34d399; box-shadow:0 0 10px #34d399; }

  .m-cross { box-shadow:inset 0 0 35px rgba(245,158,11,.13),0 12px 25px rgba(0,0,0,.2); cursor:not-allowed; }
  .m-cross .mi { box-shadow:0 0 24px rgba(245,158,11,.45); }
  .m-cross .ml { background:#fbbf24; box-shadow:0 0 10px #fbbf24; }

  .m-sodo { box-shadow:inset 0 0 35px rgba(244,63,94,.13),0 12px 25px rgba(0,0,0,.2); }
  .m-sodo .mi { box-shadow:0 0 24px rgba(244,63,94,.45); }
  .m-sodo .ml { background:#fb7185; box-shadow:0 0 10px #fb7185; }

  .mobile-maintenance {
    margin-top:8px;
    padding:5px 10px;
    border-radius:999px;
    background:linear-gradient(#fde68a,#fbbf24);
    color:#3b2500;
    border:1px solid rgba(255,255,255,.55);
    font-size:9px;
    font-weight:900;
  }

  .mobile-footer {
    margin-top:17px;
    color:rgba(255,255,255,.42);
    font-size:10px;
  }

  /* Phones: one full-width menu per row for narrow screens. */
  @media (max-width:430px) {
    .mobile-ui {
      padding:22px 12px 26px;
    }

    .mobile-logo {
      font-size:37px;
    }

    .mobile-logo-mark {
      width:39px;
      height:39px;
    }

    .mobile-welcome {
      font-size:20px;
    }

    .mobile-panel {
      padding:11px;
    }

    .mobile-menus {
      grid-template-columns:1fr;
      gap:10px;
    }

    .mobile-menu {
      min-height:112px;
      flex-direction:row;
      justify-content:flex-start;
      gap:15px;
      padding:13px 17px;
    }

    .mobile-menu .mi {
      width:54px;
      height:54px;
      flex:0 0 54px;
      margin:0;
    }

/* =========================================================
   KINO LIVE MOTION
   Visible animated light, glow and card effects
   ========================================================= */

.motion {
  position:absolute;
  z-index:3;
  pointer-events:none;
  border-radius:50%;
  mix-blend-mode:screen;
  filter:blur(18px);
}

.motion-a {
  width:240px;
  height:240px;
  left:8%;
  top:18%;
  background:radial-gradient(circle, rgba(56,189,248,.48) 0%, rgba(56,189,248,.12) 28%, transparent 70%);
  animation:orbA 7s ease-in-out infinite alternate;
}

.motion-b {
  width:280px;
  height:280px;
  right:8%;
  top:25%;
  background:radial-gradient(circle, rgba(167,139,250,.38) 0%, rgba(167,139,250,.10) 30%, transparent 70%);
  animation:orbB 9s ease-in-out infinite alternate;
}

.motion-c {
  width:220px;
  height:220px;
  left:43%;
  bottom:4%;
  background:radial-gradient(circle, rgba(251,191,36,.30) 0%, rgba(56,189,248,.10) 35%, transparent 72%);
  animation:orbC 8s ease-in-out infinite alternate;
}

.panel-sweep {
  position:absolute;
  z-index:4;
  pointer-events:none;
  top:30%;
  left:-30%;
  width:18%;
  height:44%;
  transform:skewX(-18deg);
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.03) 25%,
    rgba(125,211,252,.38) 50%,
    rgba(255,255,255,.05) 75%,
    transparent 100%
  );
  filter:blur(7px);
  animation:bigSweep 5.5s ease-in-out infinite;
}

.spark {
  position:absolute;
  z-index:5;
  width:7px;
  height:7px;
  border-radius:50%;
  pointer-events:none;
  background:#fff;
  box-shadow:
    0 0 7px #fff,
    0 0 16px currentColor,
    0 0 32px currentColor;
}

.spark-1 {
  left:23%;
  top:33%;
  color:#38bdf8;
  animation:sparkMove1 4.5s ease-in-out infinite;
}
.spark-2 {
  left:57%;
  top:20%;
  color:#fbbf24;
  animation:sparkMove2 5.2s ease-in-out infinite;
}
.spark-3 {
  left:75%;
  top:57%;
  color:#c084fc;
  animation:sparkMove3 4.8s ease-in-out infinite;
}
.spark-4 {
  left:38%;
  top:72%;
  color:#34d399;
  animation:sparkMove4 6s ease-in-out infinite;
}

/* Make the menu cards visibly pulse even without hover. */
.hotspot {
  overflow:hidden;
}

.hotspot::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  border-radius:22px;
  pointer-events:none;
  background:linear-gradient(
    115deg,
    transparent 20%,
    rgba(255,255,255,.05) 40%,
    rgba(255,255,255,.36) 50%,
    rgba(255,255,255,.05) 60%,
    transparent 80%
  );
  transform:translateX(-130%);
  animation:cardShine 3.8s ease-in-out infinite;
}

.hotspot::after {
  content:"";
  position:absolute;
  inset:2px;
  z-index:0;
  border-radius:22px;
  pointer-events:none;
  opacity:.0;
  animation:cardGlow 2.8s ease-in-out infinite;
}

.pia::after { box-shadow:inset 0 0 24px rgba(56,189,248,.55), 0 0 25px rgba(56,189,248,.30); }
.binbee::after { box-shadow:inset 0 0 24px rgba(192,132,252,.55), 0 0 25px rgba(192,132,252,.30); animation-delay:.6s; }
.kapuk::after { box-shadow:inset 0 0 24px rgba(52,211,153,.55), 0 0 25px rgba(52,211,153,.30); animation-delay:1.1s; }
.cross::after { box-shadow:inset 0 0 24px rgba(251,191,36,.55), 0 0 25px rgba(251,191,36,.30); animation-delay:1.7s; }
.sodo::after { box-shadow:inset 0 0 24px rgba(251,113,133,.55), 0 0 25px rgba(251,113,133,.30); animation-delay:2.2s; }

@keyframes bigSweep {
  0%, 12% { left:-32%; opacity:0; }
  25% { opacity:.95; }
  55% { opacity:.75; }
  82%, 100% { left:118%; opacity:0; }
}

@keyframes orbA {
  0% { transform:translate(0,0) scale(.72); opacity:.35; }
  50% { transform:translate(120px,35px) scale(1.18); opacity:.82; }
  100% { transform:translate(35px,90px) scale(.88); opacity:.48; }
}

@keyframes orbB {
  0% { transform:translate(0,0) scale(.8); opacity:.35; }
  50% { transform:translate(-95px,75px) scale(1.22); opacity:.78; }
  100% { transform:translate(-30px,-30px) scale(.92); opacity:.45; }
}

@keyframes orbC {
  0% { transform:translate(0,0) scale(.75); opacity:.25; }
  50% { transform:translate(85px,-55px) scale(1.2); opacity:.65; }
  100% { transform:translate(-80px,-15px) scale(.9); opacity:.35; }
}

@keyframes cardShine {
  0%, 32% { transform:translateX(-130%); opacity:0; }
  42% { opacity:1; }
  62%, 100% { transform:translateX(130%); opacity:0; }
}

@keyframes cardGlow {
  0%, 100% { opacity:0; transform:scale(.97); }
  42% { opacity:.55; transform:scale(1); }
  65% { opacity:.10; transform:scale(1.025); }
}

@keyframes sparkMove1 {
  0%,100% { transform:translate(0,0) scale(.6); opacity:.2; }
  35% { transform:translate(90px,-35px) scale(1.5); opacity:1; }
  70% { transform:translate(145px,55px) scale(.8); opacity:.4; }
}

@keyframes sparkMove2 {
  0%,100% { transform:translate(0,0) scale(.5); opacity:.2; }
  45% { transform:translate(-110px,70px) scale(1.6); opacity:1; }
  75% { transform:translate(-45px,130px) scale(.7); opacity:.35; }
}

@keyframes sparkMove3 {
  0%,100% { transform:translate(0,0) scale(.5); opacity:.25; }
  40% { transform:translate(-75px,-85px) scale(1.5); opacity:1; }
  75% { transform:translate(-140px,-10px) scale(.8); opacity:.35; }
}

@keyframes sparkMove4 {
  0%,100% { transform:translate(0,0) scale(.6); opacity:.2; }
  45% { transform:translate(65px,-70px) scale(1.5); opacity:1; }
  80% { transform:translate(135px,-5px) scale(.7); opacity:.3; }
}

@media (prefers-reduced-motion: reduce) {
  .motion, .spark, .panel-sweep, .hotspot::before, .hotspot::after {
    animation:none !important;
  }
}
